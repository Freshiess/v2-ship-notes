<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2 Ship Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">

<script>
  // ============ YOUR SETTINGS (step 3 of the README) ============
  const SUPABASE_URL = "https://YOUR-PROJECT-ID.supabase.co";
  const SUPABASE_KEY = "YOUR-PUBLISHABLE-OR-ANON-KEY";
  const BOARD_TITLE_TOP = "V2 Ship";
  const BOARD_TITLE_BOTTOM = "Notes";
  const BOARD_SUBTITLE = "V2 is out the door. Thank whoever migrated, tested, fixed or shipped it, or just say how launch week went.";
  const STAMP_TEXT = "V2";          // stamped on every slide in the slideshow
  const SLIDE_SECONDS = 8;          // default time per slide
  // ==============================================================
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

<style>
  :root {
    --bg: #E8EBF2;
    --ink: #1B1D33;
    --ink-soft: #565A78;
    --panel: #FFFFFF;
    --line: #C9CEDD;
    --note-ink: #1B1D33;
    --note-yellow: #FFE45C;
    --note-pink: #FF9ED2;
    --note-blue: #8FC3FF;
    --note-green: #8EE6B4;
    --note-orange: #FFB36B;
    --space: #0A0E2E;
    --space-glow: #232B7A;
    --space-ink: #EEF0FA;
    --shadow: 0 1px 0 rgba(27,29,51,.15), 0 8px 18px -10px rgba(27,29,51,.45);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12142A;
      --ink: #EEF0FA;
      --ink-soft: #A3A8C8;
      --panel: #1D2040;
      --line: #343861;
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 20px -10px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  body.locked { overflow: hidden; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 48px; }

  /* ---------- Header ---------- */
  header { display: grid; grid-template-columns: 1fr minmax(0, 440px); gap: 32px; align-items: end; margin-bottom: 40px; }
  h1 {
    font-size: clamp(3rem, 9vw, 6.5rem); line-height: .88; font-weight: 800;
    letter-spacing: -.04em; margin: 0 0 14px; font-variation-settings: "opsz" 96;
  }
  h1 span { display: block; transform: translateX(.6em); }
  .lede { margin: 0; color: var(--ink-soft); max-width: 36ch; font-size: 1.05rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .btn {
    font: inherit; font-weight: 600; font-size: .95rem; border-radius: 999px; padding: 9px 18px; cursor: pointer;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  }
  .btn.primary { background: var(--ink); color: var(--bg); font-weight: 800; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid var(--ink-soft); outline-offset: 2px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; }
  .toggle .pip { width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
  .toggle .pip::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .2s; }
  .toggle[aria-pressed="true"] .pip { background: var(--ink); }
  .toggle[aria-pressed="true"] .pip::after { transform: translateX(12px); }

  /* ---------- Composer ---------- */
  .composer {
    background: var(--draft, var(--note-yellow)); color: var(--note-ink);
    padding: 18px 18px 14px; box-shadow: var(--shadow);
    transform: rotate(-1.2deg); border-radius: 3px 3px 14px 3px; transition: background-color .2s;
  }
  .field { display: flex; gap: 8px; align-items: baseline; font-weight: 600; font-size: .95rem; }
  .field + .field { margin-top: 6px; }
  .field span { min-width: 2.6em; }
  .composer input[type="text"], .composer textarea {
    font: inherit; color: var(--note-ink); background: transparent; border: 0;
    border-bottom: 1.5px dashed rgba(27,29,51,.35); width: 100%; padding: 4px 2px; font-weight: 400;
  }
  .composer textarea {
    border: 0; resize: vertical; min-height: 110px; font-size: 1.15rem; line-height: 1.5; margin-top: 10px;
    background-image: repeating-linear-gradient(transparent 0 1.67rem, rgba(27,29,51,.13) 1.67rem calc(1.67rem + 1px));
    background-attachment: local;
  }
  .composer input::placeholder, .composer textarea::placeholder { color: rgba(27,29,51,.5); }
  .composer input:focus-visible, .composer textarea:focus-visible { outline: 2px solid var(--note-ink); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .swatches { display: flex; gap: 6px; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(27,29,51,.4); cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--note-ink); box-shadow: 0 0 0 2px var(--note-ink) inset, 0 0 0 2px #fff inset; }
  .swatch:focus-visible { outline: 2px solid var(--note-ink); outline-offset: 2px; }
  .count { font-size: .8rem; color: rgba(27,29,51,.6); margin-left: auto; }
  .post {
    font: inherit; font-weight: 800; font-size: 1rem; background: var(--note-ink); color: #fff; border: 0;
    padding: 10px 20px; border-radius: 999px; cursor: pointer;
  }
  .post:disabled { opacity: .4; cursor: not-allowed; }
  .post:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .status { font-size: .85rem; min-height: 1.2em; margin: 6px 0 0; }
  .notice { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; color: var(--ink-soft); }

  /* ---------- Board ---------- */
  .board { columns: 280px; column-gap: 22px; }
  .note {
    break-inside: avoid; display: inline-block; width: 100%; margin: 0 0 26px;
    background: var(--c); color: var(--note-ink);
    padding: 16px 16px 10px; border-radius: 3px 3px 12px 3px;
    box-shadow: var(--shadow); transform: rotate(var(--tilt)); position: relative;
  }
  [data-motion="on"] .note.fresh { animation: drop .45s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes drop { from { transform: translateY(-18px) rotate(0deg) scale(.94); opacity: 0; } }
  .note::before {
    content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; margin-left: -32px;
    background: rgba(255,255,255,.55); transform: rotate(var(--tape)); box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .note .to { font-weight: 800; font-size: 1.15rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; }
  .note .msg { margin: 0; font-size: 1.05rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note .meta { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .85rem; color: rgba(27,29,51,.72); }
  .note .meta .who { font-weight: 600; color: var(--note-ink); }
  .note .meta time { margin-left: auto; white-space: nowrap; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; border-top: 1px dashed rgba(27,29,51,.25); padding-top: 8px; }
  .react {
    font: inherit; font-size: .85rem; background: rgba(255,255,255,.4); color: var(--note-ink);
    border: 1px solid transparent; border-radius: 999px; padding: 2px 8px; cursor: pointer;
    display: inline-flex; gap: 4px; align-items: center;
  }
  .react[aria-pressed="true"] { background: rgba(255,255,255,.85); border-color: var(--note-ink); }
  .react:focus-visible, .mini:focus-visible { outline: 2px solid var(--note-ink); outline-offset: 1px; }
  .mini {
    font: inherit; font-size: .8rem; background: none; border: 0; color: rgba(27,29,51,.7); cursor: pointer;
    text-decoration: underline; padding: 2px 4px;
  }
  .mini.first { margin-left: auto; }
  .empty { text-align: center; padding: 56px 20px; color: var(--ink-soft); border: 2px dashed var(--line); border-radius: 16px; column-span: all; }
  .empty strong { display: block; color: var(--ink); font-size: 1.4rem; margin-bottom: 4px; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 20px 32px; display: flex; justify-content: flex-end; }
  .mod { font: inherit; font-size: .85rem; color: var(--ink-soft); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }
  .mod:focus-visible { outline: 2px solid var(--ink); }

  /* Confetti burst after posting */
  .confetti { position: fixed; width: 8px; height: 12px; pointer-events: none; z-index: 40; border-radius: 1px;
    animation: pop 1s cubic-bezier(.2,.7,.4,1) forwards; }
  @keyframes pop {
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  /* ---------- Slideshow ---------- */
  .show {
    position: fixed; inset: 0; z-index: 50; color: var(--space-ink);
    background: radial-gradient(120% 90% at 50% 110%, var(--space-glow) 0%, var(--space) 60%);
    display: grid; grid-template-rows: auto 1fr auto;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  .show[hidden] { display: none; }
  .show canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .show-top, .show-bottom { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 16px 22px; flex-wrap: wrap; }
  .show-brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
  .show-count { margin-left: auto; font-variant-numeric: tabular-nums; color: #A9B1E6; }
  .stage { position: relative; z-index: 1; display: grid; place-items: center; overflow: hidden; padding: 30px 20px; }
  .slide { grid-area: 1 / 1; width: min(880px, 88vw); position: relative; }
  .slide-note {
    background: var(--c); color: var(--note-ink); position: relative;
    padding: clamp(26px, 5vw, 60px) clamp(24px, 5vw, 60px) clamp(22px, 3.5vw, 40px);
    border-radius: 4px 4px 26px 4px; transform: rotate(var(--tilt));
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.75);
  }
  .s-to { font-weight: 800; font-size: clamp(1.4rem, 3.6vw, 2.6rem); line-height: 1.05; letter-spacing: -.02em; margin: 0 0 .5em; }
  .s-msg { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.25; letter-spacing: -.01em; }
  .s-msg.len-s { font-size: clamp(1.7rem, 4.6vw, 3.4rem); font-weight: 600; }
  .s-msg.len-m { font-size: clamp(1.35rem, 3.2vw, 2.4rem); }
  .s-msg.len-l { font-size: clamp(1.05rem, 2.2vw, 1.6rem); line-height: 1.35; }
  .s-meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 1.4em; font-size: clamp(1rem, 1.8vw, 1.3rem); }
  .s-meta .who { font-weight: 800; }
  .s-meta .rx { margin-left: auto; display: flex; gap: 12px; }
  .stamp {
    position: absolute; top: -30px; right: -20px; width: clamp(68px, 9vw, 96px); aspect-ratio: 1;
    border-radius: 50%; background: var(--note-ink); color: var(--c);
    display: grid; place-items: center; font-weight: 800; font-size: clamp(1.4rem, 2.6vw, 2.1rem);
    transform: rotate(-14deg); box-shadow: 0 0 0 4px var(--c), 0 0 0 6px var(--note-ink);
  }
  .flame {
    position: absolute; top: 100%; left: 32%; width: 36%; height: 180px; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse 50% 70% at 50% 0%, #FFF8D0 0%, #FFE45C 22%, #FF7A3D 48%, rgba(255,90,60,0) 72%);
    filter: blur(3px); transform-origin: top center;
  }
  [data-motion="on"] .slide.out-up { animation: outUp .75s cubic-bezier(.55,0,.85,.35) forwards; z-index: 2; }
  [data-motion="on"] .slide.out-up .flame { opacity: 1; animation: flicker .08s infinite alternate; }
  [data-motion="on"] .slide.out-down { animation: outDown .55s cubic-bezier(.55,0,.85,.35) forwards; z-index: 2; }
  [data-motion="on"] .slide.in-up { animation: inUp .8s cubic-bezier(.2,.8,.3,1.15) .45s both; }
  [data-motion="on"] .slide.in-down { animation: inDown .7s cubic-bezier(.2,.8,.3,1.1) .35s both; }
  [data-motion="on"] .slide.in-up .stamp, [data-motion="on"] .slide.in-down .stamp { animation: stampIn .35s cubic-bezier(.3,1.6,.5,1) 1.2s both; }
  @keyframes outUp { to { transform: translateY(-120vh) rotate(-3deg) scale(.9); } }
  @keyframes outDown { to { transform: translateY(110vh) rotate(4deg); opacity: .4; } }
  @keyframes inUp {
    from { transform: translateY(75vh) scale(.88) rotate(3deg); opacity: 0; }
    65% { transform: translateY(-2.5vh) scale(1.01); opacity: 1; }
    to { transform: none; }
  }
  @keyframes inDown { from { transform: translateY(-75vh) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes stampIn { from { transform: rotate(-40deg) scale(2.6); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }
  @keyframes flicker { from { transform: scaleY(.85) scaleX(1.05); } to { transform: scaleY(1.15) scaleX(.95); } }

  .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.12); }
  .progress i { display: block; height: 100%; width: 0; background: var(--note-yellow); }
  .ctl, .show select {
    font: inherit; font-size: .95rem; background: rgba(255,255,255,.08); color: var(--space-ink);
    border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .show select option { color: #1B1D33; }
  .ctl.play { background: var(--note-yellow); color: var(--note-ink); border-color: var(--note-yellow); font-weight: 800; min-width: 92px; }
  .ctl:focus-visible, .show select:focus-visible { outline: 2px solid var(--note-yellow); outline-offset: 2px; }
  .spacer { flex: 1; }
  .countdown {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none;
    font-weight: 800; font-size: clamp(6rem, 26vw, 18rem); letter-spacing: -.05em; line-height: 1;
  }
  .countdown span { animation: count .7s cubic-bezier(.2,.8,.3,1) both; }
  .countdown span.word { font-size: .45em; color: var(--note-yellow); }
  @keyframes count { from { transform: scale(1.8); opacity: 0; } 30% { opacity: 1; } to { transform: scale(.9); opacity: 0; } }
  .toast {
    position: absolute; z-index: 3; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--note-yellow); color: var(--note-ink); font-weight: 600; padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.6);
  }
  .toast[hidden] { display: none; }

  @media (max-width: 760px) {
    header { grid-template-columns: 1fr; gap: 24px; }
    h1 span { transform: translateX(.35em); }
    .composer { transform: none; }
    .hide-sm { display: none; }
    .slide { width: 84vw; }
    .stamp { right: -10px; top: -24px; }
  }
</style>
</head>
<body data-motion="on">
<div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="lede" id="subtitle"></p>
      <div class="actions">
        <button type="button" class="btn primary" id="presentBtn" disabled>Present slideshow</button>
        <button type="button" class="btn toggle" id="motionBtn" aria-pressed="true"><span class="pip" aria-hidden="true"></span>Animations</button>
      </div>
    </div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="field"><span>To</span><input type="text" id="toInput" maxlength="60" placeholder="a teammate, a squad, the whole team"></label>
      <textarea id="msgInput" maxlength="500" placeholder="Who helped get V2 over the line?" aria-label="Your shoutout" required></textarea>
      <label class="field"><span>From</span><input type="text" id="fromInput" maxlength="40" placeholder="your name, or leave blank to stay anonymous"></label>
      <div class="row">
        <div class="swatches" role="group" aria-label="Note color" id="swatches"></div>
        <span class="count" id="count">0 / 500</span>
      </div>
      <div class="row">
        <button type="submit" class="post" id="postBtn" disabled>Post shoutout</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </form>
  </header>

  <main id="board" class="board" aria-live="polite">
    <div class="notice">Loading the board…</div>
  </main>
</div>
<footer><button type="button" class="mod" id="modBtn">Moderate</button></footer>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="Shoutout slideshow">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="show-top">
    <span class="show-brand" id="showBrand"></span>
    <span class="show-count" id="showCount" aria-live="polite"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="show-bottom">
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <button type="button" class="ctl" id="prevBtn" aria-label="Previous shoutout">Back</button>
    <button type="button" class="ctl play" id="playBtn">Pause</button>
    <button type="button" class="ctl" id="nextBtn" aria-label="Next shoutout">Next</button>
    <span class="spacer"></span>
    <select id="orderSel" aria-label="Slide order">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="shuffle">Shuffle</option>
    </select>
    <select id="speedSel" aria-label="Seconds per slide">
      <option value="5">5 sec</option>
      <option value="8">8 sec</option>
      <option value="12">12 sec</option>
      <option value="20">20 sec</option>
    </select>
    <button type="button" class="ctl hide-sm" id="fsBtn">Full screen</button>
    <button type="button" class="ctl" id="exitBtn">Exit</button>
  </div>
  <div class="countdown" id="countdown" aria-hidden="true"></div>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

<script>
(() => {
  const COLORS = ["yellow", "pink", "blue", "green", "orange"];
  const REACTIONS = [["party", "🎉"], ["heart", "❤️"], ["clap", "👏"], ["fire", "🔥"], ["laugh", "😂"]];
  const MAX = 500;

  const $ = id => document.getElementById(id);
  const boardEl = $("board");

  $("title").append(document.createTextNode(BOARD_TITLE_TOP));
  const sub = document.createElement("span"); sub.textContent = BOARD_TITLE_BOTTOM; $("title").append(sub);
  $("subtitle").textContent = BOARD_SUBTITLE;
  $("showBrand").textContent = BOARD_TITLE_TOP + " " + BOARD_TITLE_BOTTOM;

  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (_) { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  };
  const session = {
    get(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (_) {} }
  };

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function hash(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
  function ago(iso) {
    const ms = new Date(iso).getTime();
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    if (s < 604800) return Math.floor(s / 86400) + "d ago";
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  // ---------- Animations toggle ----------
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let motion = store.get("shoutout-motion", !reduced);
  const motionBtn = $("motionBtn");
  function applyMotion() {
    document.body.dataset.motion = motion ? "on" : "off";
    motionBtn.setAttribute("aria-pressed", String(motion));
    motionBtn.lastChild.textContent = motion ? "Animations on" : "Animations off";
  }
  motionBtn.addEventListener("click", () => {
    motion = !motion; store.set("shoutout-motion", motion); applyMotion();
    if (show.open) { motion ? startStars() : drawStaticStars(); }
  });
  applyMotion();

  function confetti(fromEl) {
    if (!motion) return;
    const r = fromEl.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const palette = COLORS.map(c => getComputedStyle(document.documentElement).getPropertyValue("--note-" + c));
    for (let i = 0; i < 34; i++) {
      const p = el("span", "confetti");
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
      p.style.left = x + "px"; p.style.top = y + "px";
      p.style.background = palette[i % palette.length];
      p.style.setProperty("--dx", Math.cos(a) * d + "px");
      p.style.setProperty("--dy", Math.sin(a) * d - 60 + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1100);
    }
  }

  if (!window.supabase || SUPABASE_URL.includes("YOUR-PROJECT-ID")) {
    boardEl.replaceChildren(el("div", "notice",
      "This board isn't connected yet. Add your Supabase URL and key at the top of index.html (see the README)."));
    $("composer").querySelectorAll("input, textarea, button").forEach(x => x.disabled = true);
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let posts = [];
  let byId = new Map();
  let seen = new Set();
  let firstRender = true;
  let pickedColor = "yellow";
  let adminPw = session.get("shoutout-admin");
  let myReacts = store.get("shoutout-reacts", {});

  // ---------- Composer ----------
  const form = $("composer"), msg = $("msgInput"), to = $("toInput"), from = $("fromInput");
  const btn = $("postBtn"), count = $("count"), status = $("status"), sw = $("swatches");
  from.value = store.get("shoutout-name", "");

  COLORS.forEach(c => {
    const b = el("button", "swatch");
    b.type = "button";
    b.style.background = `var(--note-${c})`;
    b.setAttribute("aria-label", c);
    b.setAttribute("aria-pressed", String(c === pickedColor));
    b.addEventListener("click", () => {
      pickedColor = c;
      sw.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      form.style.setProperty("--draft", `var(--note-${c})`);
    });
    sw.appendChild(b);
  });

  const sync = () => {
    count.textContent = `${msg.value.length} / ${MAX}`;
    btn.disabled = msg.value.trim().length === 0;
  };
  msg.addEventListener("input", sync);

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = msg.value.trim();
    if (!text) return;
    btn.disabled = true;
    status.textContent = "Posting…";
    const author = from.value.trim().slice(0, 40);
    store.set("shoutout-name", author);
    const { error } = await sb.from("shoutouts").insert({
      message: text.slice(0, MAX), to_name: to.value.trim().slice(0, 60), author, color: pickedColor
    });
    if (error) {
      status.textContent = "Couldn't post just now. Check your connection and try again.";
      console.error(error);
    } else {
      confetti(btn);
      msg.value = ""; to.value = "";
      status.textContent = "Posted.";
      setTimeout(() => { if (status.textContent === "Posted.") status.textContent = ""; }, 2500);
      load();
    }
    sync();
  });
  sync();

  // ---------- Moderation ----------
  const modBtn = $("modBtn");
  const syncMod = () => { modBtn.textContent = adminPw ? "Exit moderation" : "Moderate"; };
  modBtn.addEventListener("click", async () => {
    if (adminPw) { adminPw = null; session.set("shoutout-admin", null); syncMod(); render(); return; }
    const pw = prompt("Admin password:");
    if (!pw) return;
    const { data, error } = await sb.rpc("check_admin", { p_password: pw });
    if (error || data !== true) { alert("That password didn't work."); return; }
    adminPw = pw; session.set("shoutout-admin", pw); syncMod(); render();
  });
  syncMod();

  // ---------- Board ----------
  function render() {
    $("presentBtn").disabled = posts.length === 0;
    if (!posts.length) {
      const empty = el("div", "empty");
      empty.appendChild(el("strong", null, "No shoutouts yet"));
      empty.appendChild(document.createTextNode("Be the first. Write one up top."));
      boardEl.replaceChildren(empty);
      firstRender = false;
      return;
    }
    const frag = document.createDocumentFragment();
    for (const p of posts) {
      const h = hash(p.id);
      const note = el("article", "note");
      const color = COLORS.includes(p.color) ? p.color : "yellow";
      note.style.setProperty("--c", `var(--note-${color})`);
      note.style.setProperty("--tilt", ((h % 7) - 3) * 0.5 + "deg");
      note.style.setProperty("--tape", ((h % 9) - 4) + "deg");
      if (!firstRender && !seen.has(p.id)) note.classList.add("fresh");

      if (p.to_name) note.appendChild(el("p", "to", "To " + p.to_name));
      note.appendChild(el("p", "msg", p.message));

      const meta = el("div", "meta");
      meta.appendChild(el("span", "who", p.author ? "From " + p.author : "Anonymous"));
      const t = el("time", null, ago(p.created_at));
      t.dateTime = p.created_at;
      meta.appendChild(t);
      note.appendChild(meta);

      const reacts = el("div", "reacts");
      const r = p.reactions || {};
      for (const [key, emoji] of REACTIONS) {
        const n = Number(r[key]) || 0;
        const mine = !!myReacts[p.id + ":" + key];
        const b = el("button", "react");
        b.type = "button";
        b.setAttribute("aria-pressed", String(mine));
        b.setAttribute("aria-label", `${key} reaction, ${n}`);
        b.appendChild(document.createTextNode(emoji));
        if (n) b.appendChild(el("span", null, String(n)));
        b.addEventListener("click", () => toggleReact(p, key, b));
        reacts.appendChild(b);
      }
      const present = el("button", "mini first", "Present");
      present.type = "button";
      present.addEventListener("click", () => openShow(p.id));
      reacts.appendChild(present);
      if (adminPw) {
        const del = el("button", "mini", "Delete");
        del.type = "button";
        del.addEventListener("click", async () => {
          if (!confirm("Delete this shoutout?")) return;
          const { data, error } = await sb.rpc("delete_shoutout", { p_id: p.id, p_password: adminPw });
          if (error || data !== true) { alert("Couldn't delete it. Your admin password may have changed."); return; }
          load();
        });
        reacts.appendChild(del);
      }
      note.appendChild(reacts);
      frag.appendChild(note);
    }
    boardEl.replaceChildren(frag);
    posts.forEach(p => seen.add(p.id));
    firstRender = false;
  }

  async function toggleReact(p, key, b) {
    const k = p.id + ":" + key;
    const on = !myReacts[k];
    b.disabled = true;
    const { error } = await sb.rpc("react", { p_id: p.id, p_key: key, p_delta: on ? 1 : -1 });
    b.disabled = false;
    if (error) { console.error(error); return; }
    if (on) myReacts[k] = true; else delete myReacts[k];
    store.set("shoutout-reacts", myReacts);
    load();
  }

  let loading = false, again = false;
  async function load() {
    if (loading) { again = true; return; }
    loading = true;
    const { data, error } = await sb.from("shoutouts")
      .select("id, created_at, to_name, author, message, color, reactions")
      .order("created_at", { ascending: false })
      .limit(400);
    loading = false;
    if (error) {
      console.error(error);
      if (!posts.length) boardEl.replaceChildren(el("div", "notice",
        "Couldn't load shoutouts. Check the Supabase URL and key in index.html, and that setup.sql ran without errors."));
    } else {
      posts = data || [];
      byId = new Map(posts.map(p => [p.id, p]));
      render();
      if (show.open) mergeIntoShow();
    }
    if (again) { again = false; load(); }
  }

  // ---------- Slideshow ----------
  const showEl = $("show"), stage = $("stage"), playBtn = $("playBtn"), progress = $("progress");
  const orderSel = $("orderSel"), speedSel = $("speedSel"), toastEl = $("toast"), countdownEl = $("countdown");
  const show = {
    open: false, ids: [], i: 0, playing: true, timer: null, current: null, skipCountdown: false,
    order: store.get("shoutout-order", "newest"),
    seconds: Number(store.get("shoutout-speed", SLIDE_SECONDS)) || SLIDE_SECONDS
  };
  orderSel.value = show.order;
  if (![...speedSel.options].some(o => Number(o.value) === show.seconds)) {
    speedSel.appendChild(new Option(show.seconds + " sec", String(show.seconds)));
  }
  speedSel.value = String(show.seconds);

  function orderedIds() {
    const ids = posts.map(p => p.id);
    if (show.order === "oldest") ids.reverse();
    if (show.order === "shuffle") {
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    }
    return ids;
  }

  function buildSlide(p) {
    const slide = el("div", "slide");
    const note = el("div", "slide-note");
    const color = COLORS.includes(p.color) ? p.color : "yellow";
    note.style.setProperty("--c", `var(--note-${color})`);
    note.style.setProperty("--tilt", ((hash(p.id) % 5) - 2) * 0.5 + "deg");
    note.appendChild(el("div", "stamp", STAMP_TEXT));
    if (p.to_name) note.appendChild(el("p", "s-to", "To " + p.to_name));
    const len = p.message.length;
    note.appendChild(el("p", "s-msg " + (len < 120 ? "len-s" : len < 280 ? "len-m" : "len-l"), p.message));
    const meta = el("div", "s-meta");
    meta.appendChild(el("span", "who", p.author ? "From " + p.author : "Anonymous"));
    const rx = el("span", "rx");
    for (const [key, emoji] of REACTIONS) {
      const n = Number((p.reactions || {})[key]) || 0;
      if (n) rx.appendChild(el("span", null, emoji + " " + n));
    }
    meta.appendChild(rx);
    note.appendChild(meta);
    slide.appendChild(note);
    slide.appendChild(el("div", "flame"));
    return slide;
  }

  function showSlide(dir) {
    // Skip shoutouts that were deleted while the show was running
    while (show.ids.length && !byId.has(show.ids[show.i])) {
      show.ids.splice(show.i, 1);
      if (show.i >= show.ids.length) show.i = 0;
    }
    if (!show.ids.length) { closeShow(); return; }
    const p = byId.get(show.ids[show.i]);
    $("showCount").textContent = `${show.i + 1} of ${show.ids.length}`;
    const next = buildSlide(p);
    const prev = show.current;
    if (motion && prev) {
      prev.classList.add(dir < 0 ? "out-down" : "out-up");
      prev.addEventListener("animationend", e => { if (e.target === prev) prev.remove(); });
      setTimeout(() => prev.remove(), 1200);
      boostStars(dir < 0 ? -1 : 1);
    } else if (prev) {
      prev.remove();
    }
    if (motion) next.classList.add(dir < 0 ? "in-down" : "in-up");
    stage.appendChild(next);
    show.current = next;
    schedule();
  }

  function schedule() {
    clearTimeout(show.timer);
    progress.style.transition = "none";
    progress.style.width = "0%";
    if (!show.playing) return;
    void progress.offsetWidth;
    progress.style.transition = `width ${show.seconds}s linear`;
    progress.style.width = "100%";
    show.timer = setTimeout(() => go(1), show.seconds * 1000);
  }

  function go(delta) {
    if (!show.ids.length) return;
    show.i = (show.i + delta + show.ids.length) % show.ids.length;
    showSlide(delta);
  }

  function setPlaying(on) {
    show.playing = on;
    playBtn.textContent = on ? "Pause" : "Play";
    schedule();
  }

  function mergeIntoShow() {
    const fresh = posts.map(p => p.id).filter(id => !show.ids.includes(id));
    if (!fresh.length) return;
    show.ids.splice(show.i + 1, 0, ...fresh); // new shoutouts play next
    $("showCount").textContent = `${show.i + 1} of ${show.ids.length}`;
    toastEl.textContent = fresh.length === 1 ? "A new shoutout just landed. It's up next." : `${fresh.length} new shoutouts just landed. They're up next.`;
    toastEl.hidden = false;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => { toastEl.hidden = true; }, 4000);
  }

  async function countdown() {
    show.skipCountdown = false;
    for (const t of ["3", "2", "1", "Liftoff"]) {
      if (show.skipCountdown || !show.open) break;
      const s = el("span", t.length > 1 ? "word" : null, t);
      countdownEl.replaceChildren(s);
      if (t.length > 1) boostStars(1);
      await sleep(t.length > 1 ? 650 : 700);
    }
    countdownEl.replaceChildren();
  }

  async function openShow(startId) {
    if (!posts.length || show.open) return;
    show.open = true;
    show.ids = orderedIds();
    show.i = Math.max(0, startId ? show.ids.indexOf(startId) : 0);
    stage.replaceChildren(); show.current = null;
    $("showCount").textContent = "";
    showEl.hidden = false;
    document.body.classList.add("locked");
    playBtn.focus();
    resizeStars();
    if (motion) { startStars(); if (!startId) await countdown(); }
    else drawStaticStars();
    if (!show.open) return;
    setPlaying(!startId);  // a single "Present" starts paused on that note
    showSlide(1);
  }

  function closeShow() {
    show.open = false;
    clearTimeout(show.timer);
    stopStars();
    showEl.hidden = true;
    toastEl.hidden = true;
    countdownEl.replaceChildren();
    document.body.classList.remove("locked");
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    $("presentBtn").focus();
  }

  $("presentBtn").addEventListener("click", () => openShow());
  $("exitBtn").addEventListener("click", closeShow);
  $("nextBtn").addEventListener("click", () => go(1));
  $("prevBtn").addEventListener("click", () => go(-1));
  playBtn.addEventListener("click", () => setPlaying(!show.playing));
  orderSel.addEventListener("change", () => {
    show.order = orderSel.value; store.set("shoutout-order", show.order);
    const cur = show.ids[show.i];
    show.ids = orderedIds();
    show.i = Math.max(0, show.ids.indexOf(cur));
    $("showCount").textContent = `${show.i + 1} of ${show.ids.length}`;
  });
  speedSel.addEventListener("change", () => {
    show.seconds = Number(speedSel.value); store.set("shoutout-speed", show.seconds); schedule();
  });
  $("fsBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (showEl.requestFullscreen) showEl.requestFullscreen().catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    $("fsBtn").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
  });
  showEl.addEventListener("click", e => { if (e.target === countdownEl || e.target.closest(".stage")) show.skipCountdown = true; });
  document.addEventListener("keydown", e => {
    if (!show.open) return;
    if (e.target.tagName === "SELECT") return;
    show.skipCountdown = true;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); setPlaying(!show.playing); }
    else if (e.key === "Escape" && !document.fullscreenElement) closeShow();
    else if (e.key === "f" || e.key === "F") $("fsBtn").click();
  });

  // Starfield behind the slideshow: drifts slowly, rushes past on each launch
  const canvas = $("stars"), ctx = canvas.getContext("2d");
  let stars = [], speed = 0.5, target = 0.5, raf = 0, W = 0, H = 0;
  function resizeStars() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = showEl.clientWidth; H = showEl.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!stars.length) stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * .9 + .1 }));
  }
  function drawStars(dt) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.y += (speed * s.z * dt) / H;
      if (s.y > 1) { s.y -= 1; s.x = Math.random(); }
      if (s.y < 0) { s.y += 1; s.x = Math.random(); }
      const len = Math.max(1.2, Math.abs(speed) * s.z * 2.2);
      ctx.globalAlpha = .35 + s.z * .6;
      ctx.fillStyle = "#DDE3FF";
      ctx.fillRect(s.x * W, s.y * H - (speed > 0 ? len : 0), 1.2 + s.z * .8, len);
    }
    ctx.globalAlpha = 1;
  }
  let last = 0;
  function tick(t) {
    const dt = last ? Math.min(50, t - last) / 16 : 1; last = t;
    speed += (target - speed) * .08;
    target += (0.5 - target) * .04;
    drawStars(dt);
    raf = requestAnimationFrame(tick);
  }
  function startStars() { cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(tick); }
  function stopStars() { cancelAnimationFrame(raf); raf = 0; }
  function drawStaticStars() { stopStars(); speed = 0; drawStars(0); speed = 0.5; }
  function boostStars(dir) { if (motion) target = dir > 0 ? 26 : -18; }
  window.addEventListener("resize", () => { if (show.open) { resizeStars(); if (!motion) drawStaticStars(); } });

  // ---------- Live updates ----------
  sb.channel("shoutouts-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "shoutouts" }, () => load())
    .subscribe();
  setInterval(load, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

  load();
})();
</script>
</body>
</html>
