  // Background music for the slideshow.

  const MUSIC_URL = "";

  // Brand colors. Swap in Fresh Clinics' official hex codes here.
  const BRAND = {
    primary:      "#12A07B",   // buttons, highlights (light mode)
    primaryDark:  "#45D1A8",   // the same color, brightened for dark mode
    labTop:       "#05302B",   // slideshow background, top
    labBottom:    "#0E4F46",   // slideshow background, bottom
    labGlow:      "#1FC59A",   // slideshow glow
    notes: {                   // the five note colors people can pick
      mint:  "#BFEBD9",
      blush: "#F8D6CF",
      sky:   "#CFE5F4",
      sage:  "#DDEBC6",
      sand:  "#F4E4CC"
    }
  };
  // =========================================================

  (function applyBrand() {
    const s = document.documentElement.style;
    s.setProperty("--brand-light", BRAND.primary);
    s.setProperty("--brand-dark", BRAND.primaryDark);
    s.setProperty("--lab-top", BRAND.labTop);
    s.setProperty("--lab-bottom", BRAND.labBottom);
    s.setProperty("--lab-glow", BRAND.labGlow);
    for (const [k, v] of Object.entries(BRAND.notes)) s.setProperty("--note-" + k, v);
  })();
</script>

<style>

  /* Pinned notes */
  .board { columns: 230px; column-gap: 26px; }
  .note { break-inside: avoid; display: inline-block; width: 100%; margin: 6px 0 24px; background: var(--c); color: var(--note-ink);
    padding: 32px 16px 10px; border-radius: 2px; transform: rotate(var(--tilt)); position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,.18), 0 12px 16px -10px rgba(0,0,0,.6); }
  .note::after { content: ""; position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; pointer-events: none;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.08) 50%, rgba(255,255,255,.35) 100%); }
  [data-motion="on"] .note.fresh { animation: pinIn .6s cubic-bezier(.2,.8,.3,1.25) both; }
  [data-motion="on"] .note.fresh .pin { animation: pinPop .3s cubic-bezier(.3,1.8,.5,1) .5s both; }
  @keyframes pinIn { from { opacity: 0; transform: translateY(-36px) rotate(calc(var(--tilt) * -3)) scale(1.06); } to { opacity: 1; transform: rotate(var(--tilt)); } }
  @keyframes pinPop { from { transform: scale(0) translateY(-10px); } to { transform: none; } }
  .note .to { font-family: var(--hand); font-size: 1.45rem; line-height: 1.1; margin: 0 0 6px; }
  .note .msg { margin: 0; font-family: var(--hand); font-size: 1.24rem; line-height: 1.32; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note .meta { margin-top: 12px; font-family: var(--hand); font-size: 1.08rem; }

  .react { font: inherit; font-size: .82rem; background: rgba(255,255,255,.55); color: var(--note-ink); border: 1px solid transparent; border-radius: 999px; padding: 2px 8px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  .react[aria-pressed="true"] { background: #fff; border-color: var(--note-ink); }
  .react:focus-visible, .mini:focus-visible { outline: 2px solid var(--note-ink); outline-offset: 1px; }
  .mini { font: inherit; font-size: .8rem; font-weight: 600; background: none; border: 0; color: rgba(14,42,39,.75); cursor: pointer; text-decoration: underline; padding: 2px 4px; }
  .mini.first { margin-left: auto; }
  .empty, .notice { position: relative; display: block; width: fit-content; max-width: 100%; margin: 10px auto; column-span: all; background: #FFFDF7; color: var(--note-ink);
    padding: 32px 28px 22px; text-align: center; transform: rotate(-1.2deg); font-family: var(--hand); font-size: 1.25rem;
    box-shadow: 0 1px 1px rgba(0,0,0,.18), 0 12px 16px -10px rgba(0,0,0,.6); }
  .empty::before, .notice::before { content: ""; position: absolute; top: 8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fff 0 12%, #E8505B 38% 68%, rgba(0,0,0,.45) 100%); box-shadow: 2px 4px 3px rgba(0,0,0,.38); }

  /* Droplet burst after posting */

  /* ---------- Slideshow ---------- */
  .show { position: fixed; inset: 0; z-index: 50; color: #EAF8F3; background: linear-gradient(180deg, var(--lab-top, #05302B), var(--lab-bottom, #0E4F46)); display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); overflow: hidden; }

  .show-brand { font-family: var(--serif); font-weight: 700; font-size: 1.2rem; }

  .slide-note { background: var(--c); color: var(--note-ink); position: relative; overflow: hidden; padding: clamp(28px, 5vw, 60px) clamp(24px, 5vw, 60px) clamp(22px, 3.5vw, 40px); border-radius: 30px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.4) inset; }
  .slide-note::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 40%); }
  .gloss { position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.8) 50%, transparent 65%); background-size: 250% 100%; background-position: 150% 0; }
  .scan { position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 3; opacity: 0; pointer-events: none; background: #fff; box-shadow: 0 0 18px 6px var(--lab-glow, #1FC59A), 0 0 4px 1px #fff; }

  [data-motion="on"] .slide.out .scan { animation: scan .5s ease-in forwards; }
  [data-motion="on"] .slide.out { animation: dissolve .5s ease-in .45s forwards; z-index: 2; }

  [data-motion="on"] .slide.in .ring { animation: ripple 1.2s ease-out .65s both; }
  [data-motion="on"] .slide.in .ring.r2 { animation-delay: .85s; }

  @keyframes scan { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 1; } }

  @keyframes reveal { from { clip-path: circle(0% at 50% 55%); transform: scale(.96); } to { clip-path: circle(150% at 50% 55%); transform: none; } }

  @keyframes capsuleIn { from { transform: translateY(-40px) rotate(-70deg) scale(.4); opacity: 0; } to { transform: rotate(-16deg); opacity: 1; } }

  .progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--lab-glow, #1FC59A), #fff); box-shadow: 0 0 12px var(--lab-glow, #1FC59A); }
  .ctl, .show select { font: inherit; font-size: .92rem; font-weight: 600; background: rgba(255,255,255,.09); color: #EAF8F3; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 8px 14px; cursor: pointer; }

  .countdown .beat { position: relative; display: grid; place-items: center; width: min(46vw, 320px); aspect-ratio: 1; }
  .countdown .beat::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--lab-glow, #1FC59A); box-shadow: 0 0 40px var(--lab-glow, #1FC59A) inset, 0 0 40px var(--lab-glow, #1FC59A); animation: pulse .5s ease-out both; }
  .countdown .num { font-family: var(--serif); font-weight: 700; font-size: clamp(5rem, 20vw, 13rem); line-height: 1; animation: numIn .5s cubic-bezier(.2,.8,.3,1) both; }
  .countdown .word { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: clamp(2.6rem, 9vw, 6rem); text-align: center; line-height: 1; animation: numIn .6s cubic-bezier(.2,.8,.3,1) both; text-shadow: 0 0 30px var(--lab-glow, #1FC59A); }
  .countdown svg { position: absolute; left: 0; right: 0; top: 50%; width: 100%; height: 160px; margin-top: -80px; overflow: visible; }
  .countdown path { fill: none; stroke: var(--lab-glow, #1FC59A); stroke-width: 3; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--lab-glow, #1FC59A)); stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: ecg .5s linear forwards; opacity: .55; }
  @keyframes pulse { from { transform: scale(.55); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1.05); opacity: .25; } }
  @keyframes numIn { from { transform: scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ecg { to { stroke-dashoffset: 0; } }
  .toast { position: absolute; z-index: 3; left: 50%; bottom: 100px; transform: translateX(-50%); background: #fff; color: #0E2A27; font-weight: 700; padding: 9px 18px; border-radius: 999px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.6); }
  .toast[hidden] { display: none; }

  @media (max-width: 760px) {
    .top { grid-template-columns: 1fr; gap: 26px; }
    .card, .composer { transform: none; }
    .hide-sm { display: none; }
    .slide { width: 86vw; }
    .capsule { right: 14px; }
  }
</style>
</head>
<body data-motion="on">
<div class="wall">
  <div class="frame">
    <div class="cork">
      <div class="logo">
        <span class="pin" style="--pin:#F4F4F4" aria-hidden="true"></span>
        <p class="kicker" id="kicker"></p>
        <h1 id="title"></h1>
      </div>
      <div class="top">
        <div class="card">
          <span class="pin" style="--pin:#E8505B" aria-hidden="true"></span>
          <p class="lede" id="subtitle"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="presentBtn" disabled>Present slideshow</button>
            <button type="button" class="btn toggle" id="motionBtn" aria-pressed="true"><span class="pip" aria-hidden="true"></span><span>Animations on</span></button>
          </div>
        </div>
      <form class="composer" id="composer" autocomplete="off">
        <span class="pin" style="--pin:#2FAE7A" aria-hidden="true"></span>
        <label class="field"><span>To</span><input type="text" id="toInput" maxlength="60" placeholder="a teammate, a squad, the whole team"></label>
        <textarea id="msgInput" maxlength="500" placeholder="A thank-you, a proud migration win, or feedback from a nurse…" aria-label="Your shoutout" required></textarea>
        <label class="field"><span>From</span><input type="text" id="fromInput" maxlength="40" placeholder="your name, the nurse’s name, or leave blank"></label>
        <div class="row">
          <div class="swatches" role="group" aria-label="Note color" id="swatches"></div>
          <span class="count" id="count">0 / 500</span>
        </div>
        <div class="row">
          <button type="submit" class="post" id="postBtn" disabled>Post shoutout</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </form>
      </div>

      <main id="board" class="board" aria-live="polite">
        <div class="notice">Loading the board…</div>
      </main>
    </div>
  </div>
</div>
<footer><button type="button" class="mod" id="modBtn">Moderate</button></footer>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="Shoutout slideshow">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="show-top">
    <span class="show-brand" id="showBrand"></span>
    <span class="show-count" id="showCount" aria-live="polite"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="show-bottom">
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <button type="button" class="ctl" id="prevBtn" aria-label="Previous shoutout">Back</button>
    <button type="button" class="ctl play" id="playBtn">Pause</button>
    <button type="button" class="ctl" id="nextBtn" aria-label="Next shoutout">Next</button>
    <button type="button" class="ctl" id="musicBtn" aria-pressed="true">Music on</button>
    <input type="range" class="vol hide-sm" id="volume" min="0" max="100" value="60" aria-label="Music volume">
    <span class="spacer"></span>
    <select id="orderSel" aria-label="Slide order">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="shuffle">Shuffle</option>
    </select>
    <select id="speedSel" aria-label="Seconds per slide">
      <option value="5">5 sec</option>
      <option value="8">8 sec</option>
      <option value="12">12 sec</option>
      <option value="20">20 sec</option>
    </select>
    <button type="button" class="ctl hide-sm" id="fsBtn">Full screen</button>
    <button type="button" class="ctl" id="exitBtn">Exit</button>
  </div>
  <div class="countdown" id="countdown" aria-hidden="true"></div>
  <div class="toast" id="toast" hidden role="status"></div>
</div>

<script>
(() => {
  // Database color names stay the same; each maps to a brand note color.
  const COLORS = [["yellow", "mint"], ["pink", "blush"], ["blue", "sky"], ["green", "sage"], ["orange", "sand"]];
  const COLOR_VAR = Object.fromEntries(COLORS.map(([db, name]) => [db, `var(--note-${name})`]));
  const PINS = ["#E8505B", "#F6C445", "#3E7BD6", "#2FAE7A", "#F4F4F4", "#B27FD6"];
  const REACTIONS = [["party", "🎉"], ["heart", "❤️"], ["clap", "👏"], ["fire", "🔥"], ["laugh", "😂"]];
  const MAX = 500;

  const $ = id => document.getElementById(id);
  const boardEl = $("board");

  $("kicker").textContent = BOARD_KICKER;
  $("title").append(document.createTextNode(BOARD_TITLE_TOP));
  const titleBottom = document.createElement("span"); titleBottom.textContent = BOARD_TITLE_BOTTOM;
  $("title").append(titleBottom);
  $("subtitle").textContent = BOARD_SUBTITLE;
  const brandSmall = document.createElement("small"); brandSmall.textContent = BOARD_KICKER;
  $("showBrand").append(brandSmall, document.createTextNode(BOARD_TITLE_TOP + " " + BOARD_TITLE_BOTTOM));

  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (_) { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  };
  const session = {
    get(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (_) {} }
  };

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function pin(seed) {
    const p = el("span", "pin");
    p.setAttribute("aria-hidden", "true");
    p.style.setProperty("--pin", PINS[seed % PINS.length]);
    p.style.setProperty("--px", ((seed * 13) % 31 - 15) + "%");
    return p;
  }
  function hash(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
  const fmtDate = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  const fmtDay = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function stamp(t, iso) {
    t.dateTime = iso;
    t.textContent = fmtDate.format(new Date(iso));
    t.title = ago(iso);
  }

  // ---------- Animations toggle ----------
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let motion = store.get("shoutout-motion", !reduced);
  const motionBtn = $("motionBtn");
  function applyMotion() {
    document.body.dataset.motion = motion ? "on" : "off";
    motionBtn.setAttribute("aria-pressed", String(motion));
    motionBtn.lastElementChild.textContent = motion ? "Animations on" : "Animations off";
  }
  motionBtn.addEventListener("click", () => {
    motion = !motion; store.set("shoutout-motion", motion); applyMotion();
    if (show.open) { motion ? fx.start() : fx.still(); }
  });
  applyMotion();

  function droplets(fromEl) {
    if (!motion) return;
    const r = fromEl.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const cs = getComputedStyle(document.documentElement);
    const palette = COLORS.map(([, n]) => cs.getPropertyValue("--note-" + n).trim()).concat([cs.getPropertyValue("--brand").trim()]);
    for (let i = 0; i < 26; i++) {
      const isSpark = i % 5 === 0;
      const p = el("span", isSpark ? "spark" : "drop", isSpark ? "✦" : null);
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, d = 70 + Math.random() * 140;
      const size = 6 + Math.random() * 12;
      p.style.left = x + "px"; p.style.top = y + "px";
      if (!isSpark) { p.style.width = p.style.height = size + "px"; p.style.setProperty("--d", palette[i % palette.length]); }
      p.style.setProperty("--dx", Math.cos(a) * d + "px");
      p.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }
  }

  // ---------- Music: an original upbeat track synthesized in the browser ----------
  function createMusic() {
    if (MUSIC_URL) {
      const audio = new Audio(MUSIC_URL);
      audio.loop = true; audio.preload = "none";
      let vol = .6, fadeT = 0;
      const fade = (to, ms, done) => {
        clearInterval(fadeT);
        const from = audio.volume, start = performance.now();
        fadeT = setInterval(() => {
          const k = Math.min(1, (performance.now() - start) / ms);
          audio.volume = Math.max(0, Math.min(1, from + (to - from) * k));
          if (k >= 1) { clearInterval(fadeT); if (done) done(); }
        }, 40);
      };
      return {
        start() { audio.volume = 0; audio.play().then(() => fade(vol, 1200)).catch(() => {}); },
        stop() { fade(0, 600, () => audio.pause()); },
        setVolume(v) { vol = v; if (!audio.paused) audio.volume = v; },
        setLevel() {}, chime() {}
      };
    }

    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    let ctx = null, master = null, noise = null, timer = 0, next = 0, stepN = 0, level = 0, vol = .6, running = false;
    const BPM = 118, STEP = 60 / BPM / 4;
    // C – G – Am – F, the classic feel-good progression
    const CHORDS = [[60, 64, 67], [59, 62, 67], [57, 60, 64], [57, 60, 65]];
    const BASS = [36, 31, 33, 29];
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);

    function env(g, t, peak, dur) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }
    function kick(t) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
      env(g, t, .9, .32); o.connect(g).connect(master); o.start(t); o.stop(t + .35);
    }
    function hiss(t, dur, type, freq, peak) {
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; f.type = type; f.frequency.value = freq;
      env(g, t, peak, dur); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + .02);
    }
    function tone(t, midi, type, peak, dur, cutoff) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = hz(midi);
      env(g, t, peak, dur);
      if (cutoff) { const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff; f.Q.value = 4; o.connect(f).connect(g); }
      else o.connect(g);
      g.connect(master); o.start(t); o.stop(t + dur + .05);
    }
    function play(n, t) {
      const s = n % 16, bar = Math.floor(n / 16) % 4, chord = CHORDS[bar];
      if (s % 4 === 0) kick(t);
      if (s % 4 === 2) hiss(t, .11, "highpass", 7000, .14);
      if (level === 0) return;
      if (s % 2 === 1) hiss(t, .035, "highpass", 9000, .05);
      if (s === 4 || s === 12) { hiss(t, .18, "bandpass", 1500, .32); hiss(t + .012, .12, "bandpass", 2200, .18); }
      if ([0, 3, 6, 8, 10, 14].includes(s)) tone(t, BASS[bar] + (s === 14 ? 12 : 0), "sawtooth", .2, .22, 520);
      if ([2, 7, 10, 15].includes(s)) chord.forEach(m => { tone(t, m, "sawtooth", .045, .2, 2200); tone(t, m + 12, "square", .018, .14, 3000); });
      if (Math.floor(n / 64) % 2 === 1 && s % 2 === 0) tone(t, chord[(s / 2) % 3] + 24, "triangle", .07, .22);
    }
    function pump() {
      while (next < ctx.currentTime + .12) { play(stepN, next); next += STEP; stepN++; }
    }
    return {
      start() {
        if (running) return;
        try { ctx = new AC(); } catch (_) { return; }
        running = true;
        master = ctx.createGain(); master.gain.value = 0.0001;
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
        master.connect(comp).connect(ctx.destination);
        noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        ctx.resume && ctx.resume();
        next = ctx.currentTime + .06; stepN = 0;
        master.gain.exponentialRampToValueAtTime(Math.max(.0001, vol * .8), ctx.currentTime + 1);
        timer = setInterval(pump, 25); pump();
      },
      stop() {
        if (!running) return;
        running = false;
        const c = ctx, t = c.currentTime;
        master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t);
        master.gain.exponentialRampToValueAtTime(.0001, t + .5);
        setTimeout(() => { clearInterval(timer); c.close().catch(() => {}); }, 650);
      },
      setVolume(v) { vol = v; if (running) master.gain.setTargetAtTime(Math.max(.0001, v * .8), ctx.currentTime, .1); },
      setLevel(l) { level = l; },
      chime() {
        if (!running) return;
        const t = ctx.currentTime + .02;
        tone(t, 84, "sine", .12, 1.1); tone(t + .09, 91, "sine", .09, 1.2); tone(t + .18, 96, "sine", .06, 1.3);
      }
    };
  }
  const music = createMusic();
  let musicOn = store.get("shoutout-music", true) && !!music;
  const musicBtn = $("musicBtn"), volEl = $("volume");
  volEl.value = String(Math.round(store.get("shoutout-volume", .6) * 100));
  if (music) music.setVolume(Number(volEl.value) / 100);
  if (!music) musicBtn.hidden = volEl.hidden = true;
  function syncMusicBtn() { musicBtn.setAttribute("aria-pressed", String(musicOn)); musicBtn.textContent = musicOn ? "Music on" : "Music off"; }
  syncMusicBtn();
  musicBtn.addEventListener("click", () => {
    musicOn = !musicOn; store.set("shoutout-music", musicOn); syncMusicBtn();
    if (!show.open) return;
    if (musicOn) { music.start(); music.setLevel(1); } else music.stop();
  });
  volEl.addEventListener("input", () => { const v = Number(volEl.value) / 100; store.set("shoutout-volume", v); music && music.setVolume(v); });

  // ---------- Composer (built first so the color picker always shows) ----------
  let pickedColor = "yellow";
  const form = $("composer"), msg = $("msgInput"), to = $("toInput"), from = $("fromInput");
  const btn = $("postBtn"), count = $("count"), status = $("status"), sw = $("swatches");
  from.value = store.get("shoutout-name", "");

  COLORS.forEach(([db, name]) => {
    const b = el("button", "swatch");
    b.type = "button";
    b.style.background = COLOR_VAR[db];
    b.setAttribute("aria-label", name);
    b.setAttribute("aria-pressed", String(db === pickedColor));
    b.addEventListener("click", () => {
      pickedColor = db;
      sw.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      form.style.setProperty("--draft", COLOR_VAR[db]);
    });
    sw.appendChild(b);
  });

  if (!window.supabase || SUPABASE_URL.includes("YOUR-PROJECT-ID")) {
    boardEl.replaceChildren(el("div", "notice", "This board isn't connected yet. Add your Supabase URL and key at the top of index.html (see the README)."));
    $("composer").querySelectorAll("input, textarea, button").forEach(x => x.disabled = true);
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let posts = [];
  let byId = new Map();
  const cards = new Map();     // id -> { sig, node } so unchanged notes are reused, not rebuilt
  let seen = new Set();
  let firstRender = true;
  let adminPw = session.get("shoutout-admin");
  let myReacts = store.get("shoutout-reacts", {});

  const sync = () => { count.textContent = `${msg.value.length} / ${MAX}`; btn.disabled = msg.value.trim().length === 0; };
  msg.addEventListener("input", sync);

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = msg.value.trim();
    if (!text) return;
    btn.disabled = true;
    status.textContent = "Posting…";
    const author = from.value.trim().slice(0, 40);
    store.set("shoutout-name", author);
    const { error } = await sb.from("shoutouts").insert({ message: text.slice(0, MAX), to_name: to.value.trim().slice(0, 60), author, color: pickedColor });
    if (error) {
      status.textContent = "Couldn't post just now. Check your connection and try again.";
      console.error(error);
    } else {
      droplets(btn);
      msg.value = ""; to.value = "";
      status.textContent = "Posted.";
      setTimeout(() => { if (status.textContent === "Posted.") status.textContent = ""; }, 2500);
      load();
    }
    sync();
  });
  sync();

  // ---------- Moderation ----------
  const modBtn = $("modBtn");
  const syncMod = () => { modBtn.textContent = adminPw ? "Exit moderation" : "Moderate"; };
  modBtn.addEventListener("click", async () => {
    if (adminPw) { adminPw = null; session.set("shoutout-admin", null); syncMod(); render(); return; }
    const pw = prompt("Admin password:");
    if (!pw) return;
    const { data, error } = await sb.rpc("check_admin", { p_password: pw });
    if (error || data !== true) { alert("That password didn't work."); return; }
    adminPw = pw; session.set("shoutout-admin", pw); syncMod(); render();
  });
  syncMod();

  // ---------- Board ----------
  function signature(p) {
    const mine = REACTIONS.map(([k]) => myReacts[p.id + ":" + k] ? 1 : 0).join("");
    return [p.message, p.to_name, p.author, p.color, JSON.stringify(p.reactions || {}), mine, adminPw ? 1 : 0].join("|");
  }

  function buildCard(p) {
    const note = el("article", "note");
    const hh = hash(p.id);
    note.style.setProperty("--c", COLOR_VAR[p.color] || COLOR_VAR.yellow);
    note.style.setProperty("--tilt", ((hh % 9) - 4) * 0.6 + "deg");
    note.appendChild(pin(hh));
    if (p.to_name) note.appendChild(el("p", "to", "To " + p.to_name));
    note.appendChild(el("p", "msg", p.message));

    const meta = el("div", "meta");
    meta.appendChild(el("span", "who", p.author ? "From " + p.author : "Anonymous"));
    note.appendChild(meta);

    const reacts = el("div", "reacts");
    const r = p.reactions || {};
    for (const [key, emoji] of REACTIONS) {
      const n = Number(r[key]) || 0;
      const mine = !!myReacts[p.id + ":" + key];
      const b = el("button", "react");
      b.type = "button";
      b.setAttribute("aria-pressed", String(mine));
      b.setAttribute("aria-label", `${key} reaction, ${n}`);
      b.appendChild(document.createTextNode(emoji));
      if (n) b.appendChild(el("span", null, String(n)));
      b.addEventListener("click", () => toggleReact(p.id, key));
      reacts.appendChild(b);
    }
    const present = el("button", "mini first", "Present");
    present.type = "button";
    present.addEventListener("click", () => openShow(p.id));
    reacts.appendChild(present);
    if (adminPw) {
      const del = el("button", "mini", "Delete");
      del.type = "button";
      del.addEventListener("click", async () => {
        if (!confirm("Delete this shoutout?")) return;
        const { data, error } = await sb.rpc("delete_shoutout", { p_id: p.id, p_password: adminPw });
        if (error || data !== true) { alert("Couldn't delete it. Your admin password may have changed."); return; }
        load();
      });
      reacts.appendChild(del);
    }
    note.appendChild(reacts);
    return note;
  }

  function render() {
    $("presentBtn").disabled = posts.length === 0;
    if (!posts.length) {
      cards.clear();
      const empty = el("div", "empty");
      empty.appendChild(el("strong", null, "No shoutouts yet"));
      empty.appendChild(document.createTextNode("Be the first. Write one up top."));
      boardEl.replaceChildren(empty);
      firstRender = false;
      return;
    }
    const nodes = [];
    const live = new Set();
    for (const p of posts) {
      live.add(p.id);
      const sig = signature(p);
      let c = cards.get(p.id);
      if (!c || c.sig !== sig) {
        c = { sig, node: buildCard(p) };
        cards.set(p.id, c);
      }
      if (!firstRender && !seen.has(p.id)) c.node.classList.add("fresh");
      nodes.push(c.node);
    }
    for (const id of cards.keys()) if (!live.has(id)) cards.delete(id);
    boardEl.replaceChildren(...nodes);
    posts.forEach(p => seen.add(p.id));
    firstRender = false;
  }


  async function toggleReact(id, key) {
    const p = byId.get(id);
    if (!p) return;
    const k = id + ":" + key;
    const on = !myReacts[k];
    // Update the screen right away, then save
    const before = { ...(p.reactions || {}) };
    p.reactions = { ...before, [key]: Math.max(0, (Number(before[key]) || 0) + (on ? 1 : -1)) };
    if (on) myReacts[k] = true; else delete myReacts[k];
    render();
    const { error } = await sb.rpc("react", { p_id: id, p_key: key, p_delta: on ? 1 : -1 });
    if (error) {
      console.error(error);
      p.reactions = before;
      if (on) delete myReacts[k]; else myReacts[k] = true;
      render();
      return;
    }
    store.set("shoutout-reacts", myReacts);
  }

  let loading = false, again = false;
  async function load() {
    if (loading) { again = true; return; }
    loading = true;
    const { data, error } = await sb.from("shoutouts")
      .select("id, created_at, to_name, author, message, color, reactions")
      .order("created_at", { ascending: false })
      .limit(400);
    loading = false;
    if (error) {
      console.error(error);
      if (!posts.length) boardEl.replaceChildren(el("div", "notice", "Couldn't load shoutouts. Check the Supabase URL and key in index.html, and that setup.sql ran without errors."));
    } else {
      posts = data || [];
      byId = new Map(posts.map(p => [p.id, p]));
      render();
      if (show.open) mergeIntoShow();
    }
    if (again) { again = false; load(); }
  }
  let debounce = 0;
  const loadSoon = () => { clearTimeout(debounce); debounce = setTimeout(load, 250); };

  // ---------- Slideshow ----------
  const showEl = $("show"), stage = $("stage"), playBtn = $("playBtn"), progress = $("progress");
  const orderSel = $("orderSel"), speedSel = $("speedSel"), toastEl = $("toast"), countdownEl = $("countdown");
  const show = {
    open: false, ids: [], i: 0, playing: true, timer: null, current: null, skip: false,
    order: store.get("shoutout-order", "newest"),
    seconds: Number(store.get("shoutout-speed", SLIDE_SECONDS)) || SLIDE_SECONDS
  };
  orderSel.value = show.order;
  if (![...speedSel.options].some(o => Number(o.value) === show.seconds)) speedSel.appendChild(new Option(show.seconds + " sec", String(show.seconds)));
  speedSel.value = String(show.seconds);

  function orderedIds() {
    const ids = posts.map(p => p.id);
    if (show.order === "oldest") ids.reverse();
    if (show.order === "shuffle") for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    return ids;
  }

  function buildSlide(p) {
    const slide = el("div", "slide");
    slide.appendChild(el("div", "ring"));
    slide.appendChild(el("div", "ring r2"));
    const note = el("div", "slide-note");
    note.style.setProperty("--c", COLOR_VAR[p.color] || COLOR_VAR.yellow);
    note.appendChild(el("div", "gloss"));
    note.appendChild(el("div", "scan"));
    if (p.to_name) note.appendChild(el("p", "s-to", "To " + p.to_name));
    const len = p.message.length;
    note.appendChild(el("p", "s-msg " + (len < 120 ? "len-s" : len < 280 ? "len-m" : "len-l"), p.message));
    const meta = el("div", "s-meta");
    meta.appendChild(el("span", "who", p.author ? "From " + p.author : "Anonymous"));
    const rx = el("span", "rx");
    for (const [key, emoji] of REACTIONS) {
      const n = Number((p.reactions || {})[key]) || 0;
      if (n) rx.appendChild(el("span", null, emoji + " " + n));
    }
    meta.appendChild(rx);
    note.appendChild(meta);
    const cap = el("div", "capsule");
    cap.append(el("span", null, BADGE_TEXT), el("span", null, "LIVE"));
    slide.appendChild(note);
    slide.appendChild(cap);
    return slide;
  }

  function showSlide() {
    while (show.ids.length && !byId.has(show.ids[show.i])) {
      show.ids.splice(show.i, 1);
      if (show.i >= show.ids.length) show.i = 0;
    }
    if (!show.ids.length) { closeShow(); return; }
    const p = byId.get(show.ids[show.i]);
    $("showCount").textContent = `${show.i + 1} of ${show.ids.length}`;
    const next = buildSlide(p);
    const prev = show.current;
    if (motion && prev) {
      prev.classList.add("out");
      setTimeout(() => prev.remove(), 1000);
      setTimeout(() => fx.burst(), 450);
    } else if (prev) prev.remove();
    if (motion) {
      next.classList.add("in");
      setTimeout(() => { if (musicOn && music) music.chime(); }, prev ? 1400 : 700);
    }
    stage.appendChild(next);
    show.current = next;
    schedule();
  }

  function schedule() {
    clearTimeout(show.timer);
    progress.style.transition = "none";
    progress.style.width = "0%";
    if (!show.playing) return;
    void progress.offsetWidth;
    progress.style.transition = `width ${show.seconds}s linear`;
    progress.style.width = "100%";
    show.timer = setTimeout(() => go(1), show.seconds * 1000);
  }
  function go(delta) {
    if (!show.ids.length) return;
    show.i = (show.i + delta + show.ids.length) % show.ids.length;
    showSlide();
  }
  function setPlaying(on) { show.playing = on; playBtn.textContent = on ? "Pause" : "Play"; schedule(); }

  function mergeIntoShow() {
    const fresh = posts.map(p => p.id).filter(id => !show.ids.includes(id));
    if (!fresh.length) return;
    show.ids.splice(show.i + 1, 0, ...fresh);
    $("showCount").textContent = `${show.i + 1} of ${show.ids.length}`;
    toastEl.textContent = fresh.length === 1 ? "A new shoutout just landed. It's up next." : `${fresh.length} new shoutouts just landed. They're up next.`;
    toastEl.hidden = false;
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => { toastEl.hidden = true; }, 4000);
  }

  const ECG = "M0 80 L330 80 L360 80 L372 62 L384 80 L405 80 L420 10 L438 150 L452 80 L480 80 L494 66 L508 80 L1000 80";
  async function countdown() {
    show.skip = false;
    const beat = 60 / 118 * 1000;
    for (const t of ["3", "2", "1"]) {
      if (show.skip || !show.open) break;
      const wrap = el("div", "beat");
      wrap.appendChild(el("span", "num", t));
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 1000 160"); svg.setAttribute("preserveAspectRatio", "none");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", ECG); svg.appendChild(path);
      countdownEl.replaceChildren(svg, wrap);
      await sleep(beat * 2);
    }
    if (show.open && !show.skip) {
      countdownEl.replaceChildren(el("div", "word", "We're live"));
      fx.burst(60);
      if (musicOn && music) { music.setLevel(1); music.chime(); }
      await sleep(beat * 3);
    }
    countdownEl.replaceChildren();
  }

  async function openShow(startId) {
    if (!posts.length || show.open) return;
    show.open = true;
    show.ids = orderedIds();
    show.i = Math.max(0, startId ? show.ids.indexOf(startId) : 0);
    stage.replaceChildren(); show.current = null;
    $("showCount").textContent = "";
    showEl.hidden = false;
    document.body.classList.add("locked");
    playBtn.focus();
    fx.resize();
    const intro = motion && !startId;
    if (musicOn && music) { music.setLevel(intro ? 0 : 1); music.start(); }
    if (motion) { fx.start(); if (intro) await countdown(); } else fx.still();
    if (!show.open) return;
    if (musicOn && music) music.setLevel(1);
    setPlaying(!startId);
    showSlide();
  }

  function closeShow() {
    show.open = false;
    clearTimeout(show.timer);
    fx.stop();
    if (music) music.stop();
    showEl.hidden = true;
    toastEl.hidden = true;
    countdownEl.replaceChildren();
    document.body.classList.remove("locked");
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    $("presentBtn").focus();
  }

  $("presentBtn").addEventListener("click", () => openShow());
  $("exitBtn").addEventListener("click", closeShow);
  $("nextBtn").addEventListener("click", () => { show.skip = true; go(1); });
  $("prevBtn").addEventListener("click", () => { show.skip = true; go(-1); });
  playBtn.addEventListener("click", () => setPlaying(!show.playing));
  orderSel.addEventListener("change", () => {
    show.order = orderSel.value; store.set("shoutout-order", show.order);
    const cur = show.ids[show.i];
    show.ids = orderedIds();
    show.i = Math.max(0, show.ids.indexOf(cur));
    $("showCount").textContent = `${show.i + 1} of ${show.ids.length}`;
  });
  speedSel.addEventListener("change", () => { show.seconds = Number(speedSel.value); store.set("shoutout-speed", show.seconds); schedule(); });
  $("fsBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (showEl.requestFullscreen) showEl.requestFullscreen().catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => { $("fsBtn").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });
  showEl.addEventListener("click", e => { if (e.target.closest(".stage")) show.skip = true; });
  document.addEventListener("keydown", e => {
    if (!show.open || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    show.skip = true;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); setPlaying(!show.playing); }
    else if (e.key === "Escape" && !document.fullscreenElement) closeShow();
    else if (e.key === "f" || e.key === "F") $("fsBtn").click();
    else if (e.key === "m" || e.key === "M") musicBtn.click();
  });

  // ---------- Slideshow background: rising serum bubbles over a molecular mesh ----------
  const fx = (() => {
    const canvas = $("fx"), ctx = canvas.getContext("2d");
    let W = 0, H = 0, raf = 0, last = 0, bubbles = [], nodes = [], boost = 0;
    const small = () => W < 700;
    function seed() {
      const nb = small() ? 26 : 50, nn = small() ? 22 : 44;
      bubbles = Array.from({ length: nb }, () => newBubble(true));
      nodes = Array.from({ length: nn }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25 }));
    }
    function newBubble(anywhere, x, y) {
      return { x: x ?? Math.random() * W, y: y ?? (anywhere ? Math.random() * H : H + 30), r: 2 + Math.random() * Math.random() * 22, v: .25 + Math.random() * .6, w: Math.random() * Math.PI * 2, life: 1 };
    }
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = showEl.clientWidth; H = showEl.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }
    function draw(dt) {
      ctx.clearRect(0, 0, W, H);
      // molecular mesh
      for (const n of nodes) {
        n.x += n.vx * dt; n.y += n.vy * dt;
        if (n.x < 0 || n.x > W) n.vx *= -1;
        if (n.y < 0 || n.y > H) n.vy *= -1;
      }
      ctx.lineWidth = 1;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 < 150 * 150) {
            ctx.strokeStyle = `rgba(160,255,220,${.12 * (1 - Math.sqrt(d2) / 150)})`;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      ctx.fillStyle = "rgba(190,255,230,.35)";
      for (const n of nodes) { ctx.beginPath(); ctx.arc(n.x, n.y, 2, 0, Math.PI * 2); ctx.fill(); }
      // bubbles
      const speed = 1 + boost * 6;
      boost *= .94;
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.v * speed * dt;
        b.w += .02 * dt;
        const x = b.x + Math.sin(b.w) * 8;
        if (b.burst) { b.life -= .012 * dt; if (b.life <= 0) { bubbles.splice(i, 1); continue; } }
        if (b.y < -40) { if (b.burst) { bubbles.splice(i, 1); continue; } Object.assign(b, newBubble(false)); }
        const g = ctx.createRadialGradient(x - b.r * .35, b.y - b.r * .35, b.r * .1, x, b.y, b.r);
        g.addColorStop(0, `rgba(255,255,255,${.55 * b.life})`);
        g.addColorStop(.6, `rgba(170,255,225,${.12 * b.life})`);
        g.addColorStop(1, `rgba(170,255,225,${.28 * b.life})`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    function tick(t) {
      const dt = last ? Math.min(50, t - last) / 16 : 1; last = t;
      draw(dt);
      raf = requestAnimationFrame(tick);
    }
    return {
      resize,
      start() { cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(tick); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
      still() { this.stop(); draw(0); },
      burst(n = 34) {
        if (!motion) return;
        boost = 1;
        for (let i = 0; i < n; i++) {
          const b = newBubble(false, W / 2 + (Math.random() - .5) * Math.min(W * .7, 700), H / 2 + (Math.random() - .5) * 240);
          b.burst = true; b.v = 1 + Math.random() * 1.6; b.r = 2 + Math.random() * 10;
          bubbles.push(b);
        }
      }
    };
  })();
  window.addEventListener("resize", () => { if (show.open) { fx.resize(); if (!motion) fx.still(); } });

  // ---------- Live updates ----------
  sb.channel("shoutouts-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "shoutouts" }, loadSoon)
    .subscribe();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

  load();
})();
</script>
</body>
</html>
